<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>/* Alignment */
mtable.right-align mtd,
mtable mtd.right-align,
mtable.left-align mtd.right-align,
mtable.aligned mtd:nth-child(odd) {
  justify-items: end;
  text-align: right;
}
mtable.cases mtd,
mtable.left-align mtd,
mtable mtd.left-align,
mtable.aligned mtd:nth-child(even),
math:is(:not([display])) > mtable.multiline-equation mtd {
  justify-items: start;
  text-align: left;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.left-flush {
  padding-left: 0;
}
mtable.cases mtd,
mtable.aligned mtd,
mtable mtd.flushed,
mtable mtd.right-flush {
  padding-right: 0;
}

/* Tables */
mtable {
  math-style: inherit;
}
mtd {
  math-depth: auto-add;
  math-style: compact;
  math-shift: compact;
}

/* Equations */
mtable.multiline-equation mtd {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
  padding: 0;
}
math > mtable.multiline-equation mtr:not(:last-child) mtd {
  padding-bottom: 0.5em;
}

/* Fractions */
mfrac {
  padding-inline: 0;
  margin-inline: 0.1em;
}

/* Accents */
mover[accent="true" i] > :first-child {
  font-feature-settings: "dtls";
}
mover.dotted[accent="true" i] > :first-child {
  font-feature-settings: "dtls" 0;
}

/* Other rules for scriptlevel, displaystyle and math-shift */
munder > :nth-child(2),
munderover > :nth-child(2) {
  math-shift: compact
}
munder[accentunder="true" i] > :not(:first-child),
mover[accent="true" i] > :not(:first-child) {
  math-depth: inherit;
  math-style: inherit;
  math-shift: inherit;
}</style></head><body><h2>静电力计算</h2><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>示例</strong> 1<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在氢原子内，氢原子核与电子之间的最短距离为<math><mn>5.3</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup></math> m。试比较氢原子核与电子之间的静电力和万有引力。<br><br></p><p>万有引力：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝐹</mi><mi>𝐺</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mi>𝐺</mi><msub><mi>𝑚</mi><mi>𝑝</mi></msub><msub><mi>𝑚</mi><mi>𝑒</mi></msub></mrow><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>3</mn><mn>.62</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mrow><mo>−</mo><mn>47</mn></mrow></msup><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>静电力：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mi>𝐹</mi><mi>𝐸</mi></msub></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><msub><mi>𝑘</mi><mi>𝑒</mi></msub><msub><mi>𝑄</mi><mi>𝑝</mi></msub><msub><mi>𝑄</mi><mi>𝑒</mi></msub></mrow><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>8</mn><mn>.21</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>静电力与万有引力之比：</p><math display="block"><mfrac><msub><mi>𝐹</mi><mi>𝐸</mi></msub><msub><mi>𝐹</mi><mi>𝐺</mi></msub></mfrac><mo>=</mo><mn>2</mn><mn>.26</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mn>39</mn></msup></math></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>示例</strong> 2<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>真空中有三个带正电的点电荷，它们固定在边长为 50 cm 的等边三角形的三个顶点上，每个点电荷的电荷量都是 <math><mn>2.0</mn><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></math> C，求它们各自所受的静电力。<br><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center"><svg style="overflow: visible; width: 19.252463422em; height: 15.937143838em; display: block" viewBox="0 0 211.777097638 175.308582215" width="211.777097638pt" height="175.308582215pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(30.648 29.812)" d="M 0 0m 42.519685039 0l -42.519685039 73.64625481h 85.039370079l -42.519685039 -73.64625481Z "/><path fill="none" transform="translate(57.843685039)" d="M 0 0h 30.648v 29.812h -30.648v -29.812Z "/><g transform="translate(57.843684945 -1.26e-7)"><g transform="matrix(1 0 0 -1 10 17.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g38178746B45E40B27C1ECDAD3F62C0A9" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(0 88.55225481)" d="M 0 0h 30.648v 29.812h -30.648v -29.812Z "/><g transform="translate(-9.4e-8 88.552254684)"><g transform="matrix(1 0 0 -1 10 17.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g5BA3B744496DE638A69C45D17B8B8178" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(100.363370079 73.64625481)" d="M 0 0390625 0.708984375q 0.064453125 0.236328125 -0.04296875 0.34375q -0.107421875 0.107421875 -1.267578125 -0.107421875l 0.0859375 -1.07421875l 1.07421875 0.12890625Z "/></symbol></defs></svg></div><p>如上图所示: 由于 q1, q2 和 q3所处的空间位置呈现出特定的对称关系，而且每个点电荷的电荷量都相等，从图示可以看出，q1, q2和q3的静电力大小都相等，仅方向不同。</p><p>取q3作为研究对象，记它受到来自q1的力为<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub></math>，记它受到来自q2的力为<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>23</mn></msub></math>，力的方向如图所示。</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><mo stretchy="false">|</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub><mo lspace="0em" rspace="0em">|</mo><mo>=</mo><mo lspace="0em" rspace="0em">|</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>23</mn></msub><mo stretchy="false">|</mo></mtd><mtd><mo form="infix">=</mo><msub><mi>𝑘</mi><mi>𝑒</mi></msub><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><msup><mi>𝑟</mi><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>8</mn><mn>.98</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mn>9</mn></msup><mspace width="0.2222em"/><mtext>m</mtext><msup><mtext>F</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo lspace="0.2222222222222222em" rspace="0.2222222222222222em">×</mo><mfrac><msup><mrow><mo>(</mo><mrow><mn>2</mn><mn>.00</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup><mspace width="0.2222em"/><mtext>C</mtext></mrow><mo>)</mo></mrow><mn>2</mn></msup><msup><mrow><mo>(</mo><mrow><mn>5</mn><mn>.00</mn><span style="display: inline-block"></span><mspace width="0.2222em"/><mi>×</mi><mspace width="0.2222em"/><msup><mn>10</mn><mrow><mo>−</mo><mn>1</mn></mrow></msup><mtext>m</mtext></mrow><mo>)</mo></mrow><mn>2</mn></msup></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>0.144</mn><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>记 q3受到的静电力合力为<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>，由图中的几何关系可知：</p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></mtd><mtd><mo form="infix">=</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub><mo>+</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>23</mn></msub></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><msqrt><mn>3</mn></msqrt><mspace width="0.2222em"/><mo lspace="0em" rspace="0em">|</mo><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mn>13</mn></msub><mo stretchy="false">|</mo></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mn>0.25</mn><mspace width="0.2222em"/><mtext>N</mtext></mtd></mtr></mtable></math><p>如图所示，<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>的方向为向外的角平分线方向。<br>由对称关系可知 q1 和 q2的静电力合力的大小等于<math><msub><mover accent="true"><mi>𝐹</mi><mo stretchy="true">⃗</mo></mover><mtext>total</mtext></msub></math>的大小，方向为各自所在点处向外的角平分线方向。</p></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>问题</strong> 1<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>有三个完全相同的金属球，球A 带的电荷量为q，球B 和球C 均不带电。现要使球B 带 的电荷量为 <math><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></math> ，应该怎么操作？<br><br></p><math display="block"><mtable class="multiline-equation aligned"><mtr><mtd><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mfrac><mrow><mn>2</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac><mo>+</mo><mfrac><mrow><mn>4</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></mrow><mn>2</mn></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo form="infix">=</mo><mfrac><mrow><mfrac><mi>𝑞</mi><mn>4</mn></mfrac><mo>+</mo><mfrac><mi>𝑞</mi><mn>2</mn></mfrac></mrow><mn>2</mn></mfrac></mtd></mtr></mtable></math><p>先让球A与B接触，使球A和球B带电 <math><mfrac><mi>𝑞</mi><mn>2</mn></mfrac></math>，再让球B与C接触，使球B和球C带电 <math><mfrac><mi>𝑞</mi><mn>4</mn></mfrac></math>，再让球B与球A接触，使球A和球B带电 <math><mfrac><mrow><mn>3</mn><mi>𝑞</mi></mrow><mn>8</mn></mfrac></math>。</p></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>问题</strong> 2<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>半径为r 的两个金属球，其球心相距3r，现使两球带上等量的同种电荷Q，两球之间的 静电力<math><mi>𝐹</mi><mo>=</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>9</mn><msup><mi>𝑟</mi><mn>2</mn></msup></mrow></mfrac></math>吗？说明理由。<br><br></p><ul><li>由于两球距离仅为半径的三倍，不可使用点电荷模型。</li><li>由于静电感应，而且同种电荷相互排斥，电荷分布会集中在两球外侧（相背的一面）。使得电荷之间的等效距离大于3r，从而导致静电力小于<math><mi>𝐹</mi><mo>=</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>9</mn><msup><mi>𝑟</mi><mn>2</mn></msup></mrow></mfrac></math>。</li></ul></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>问题</strong> 3<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>真空中两个相同的带等量异种电荷的金属小球A 和B（均可看作点电荷），分别固定在 两处，两球之间的静电力为F。现用一个不带电的同样的金属小球C 先与A 接触，再与B 接触，然后移开C，此时A、B 之间的静电力变为多少？若再使A、B 之间距离增大为原来的2倍，则它们之间的静电力又为多少？<br><br>设接触前 <math><msub><mi>𝑄</mi><mi>𝐴</mi></msub><mo>=</mo><mi>𝑄</mi></math>，<math><msub><mi>𝑄</mi><mi>𝐵</mi></msub><mo>=</mo><mo form="prefix">−</mo><mi>𝑄</mi></math>，<math><msub><mi>𝑄</mi><mi>𝐶</mi></msub><mo>=</mo><mn>0</mn></math>，<math><msub><mi>𝐹</mi><mtext>AB</mtext></msub><mo>=</mo><mo form="prefix">−</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><msubsup><mi>𝑑</mi><mtext>AB</mtext><mn>2</mn></msubsup></mfrac></math><br></p><ol><li>球C与A接触后：<math><msubsup><mi>𝑄</mi><mi>𝐴</mi><mo>′</mo></msubsup><mo>=</mo><msubsup><mi>𝑄</mi><mi>𝐶</mi><mo>′</mo></msubsup><mo>=</mo><mfrac><mi>𝑄</mi><mn>2</mn></mfrac></math>，<math><msubsup><mi>𝑄</mi><mi>𝐵</mi><mo>′</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mi>𝑄</mi></math><br></li><li>球C与B接触后：<math><msubsup><mi>𝑄</mi><mi>𝐴</mi><mo>″</mo></msubsup><mo>=</mo><mfrac><mi>𝑄</mi><mn>2</mn></mfrac></math>，<math><msubsup><mi>𝑄</mi><mi>𝐵</mi><mo>″</mo></msubsup><mo>=</mo><msubsup><mi>𝑄</mi><mi>𝐶</mi><mo>″</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mfrac><mi>𝑄</mi><mn>4</mn></mfrac></math><br>此时的静电力为<math><msubsup><mi>𝐹</mi><mtext>AB</mtext><mo>″</mo></msubsup><mo>=</mo><mo form="prefix">−</mo><mi>𝑘</mi><mfrac><msup><mi>𝑄</mi><mn>2</mn></msup><mrow><mn>8</mn><msubsup><mi>𝑑</mi><mtext>AB</mtext><mn>2</mn></msubsup></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><msub><mi>𝐹</mi><mtext>AB</mtext></msub></math></li><li>如果再将A、B 之间距离增大为原来的2倍，即：<math><msubsup><mi>𝑑</mi><mtext>AB</mtext><mo>‴</mo></msubsup><mo>=</mo><mn>2</mn><msub><mi>𝑑</mi><mtext>AB</mtext></msub></math> 则：<math><msubsup><mi>𝐹</mi><mtext>AB</mtext><mo>‴</mo></msubsup><mo>=</mo><mfrac><mn>1</mn><mn>32</mn></mfrac><msub><mi>𝐹</mi><mtext>AB</mtext></msub></math></li></ol></div></figure><figure><div class="thmplain" style=" border-left: 5px solid #565656a2; border-radius: 10px; background: #adadad2f; padding: 0.8em;"><p><strong>问题</strong> 4<span style="white-space: pre-wrap">&#x20;&#x20;&#x20;&#x20;</span>在边长为a 的正方形的每个顶点都放置一个电荷量为q 的同种点电荷。如果保持它们的位置不变，每个电荷受到其他三个电荷的静电力的合力是多少？<br><br></p><div style="width: 100%; margin: 10pt auto; display: flex; justify-content: center"><svg style="overflow: visible; width: 14.447638797em; height: 17.87013486em; display: block" viewBox="0 0 158.924026772 196.571483465" width="158.924026772pt" height="196.571483465pt" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:h5="http://www.w3.org/1999/xhtml"><g><g><path fill="none" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" transform="translate(10.324 19.812)" d="M 0 0m 0 56.692913386h 56.692913386v -56.692913386h -56.692913386v 56.692913386Z "/><path fill="none" transform="translate(0 76.504913386)" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(-6.3e-8 76.504913291)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g38178746B45E40B27C1ECDAD3F62C0A9" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(46.368913386 76.504913386)" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(46.368913323 76.504913291)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g5BA3B744496DE638A69C45D17B8B8178" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" transform="translate(56.692913386)" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(56.692913323 -9.4e-8)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g95E62ABD17097D047789BD4F75E52D9B" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" d="M 0 0h 20.648v 19.812h -20.648v -19.812Z "/><g transform="translate(-6.3e-8 -9.4e-8)"><g transform="matrix(1 0 0 -1 5 12.238)"><use xlink:href="#g36A3A8A97C98E8EDF35F9BD5FE38C076" x="0" y="0" fill="#000000" fill-rule="nonzero"/><use xlink:href="#g64E1EAFB3C37A6348C3813C77051AC32" x="5.533" y="0" fill="#000000" fill-rule="nonzero"/></g></g><path fill="none" stroke="#ff4136" stroke-width="1" stroke-linecap="bu
