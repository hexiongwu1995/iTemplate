<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template-online</title>
    <style>
        html, body {
            width: 100%;
        }
        body {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <h2>A Level 2 heading</h2>
    <h3>A Level 3 heading</h3>

    <p>当 <math>
            <mi>𝐶</mi>
            <mo>&lt;</mo>
            <mn>0</mn>
        </math>时，对应的微分方程的通解为：<math>
            <mi>𝑋</mi>
            <mrow>
                <mo>(</mo>
                <mi>𝑥</mi>
                <mo>)</mo>
            </mrow>
            <mo>=</mo>
            <msub>
                <mi>𝐶</mi>
                <mn>1</mn>
            </msub>
            <mo form="prefix" lspace="0.16666666666666666em" rspace="0em">cos</mo>
            <mrow>
                <mo>(</mo>
                <mrow>
                    <msqrt>
                        <mo>−</mo>
                        <mi>𝐶</mi>
                    </msqrt>
                    <mi>𝑥</mi>
                </mrow>
                <mo>)</mo>
            </mrow>
            <mo>+</mo>
            <msub>
                <mi>𝐶</mi>
                <mn>2</mn>
            </msub>
            <mo form="prefix" lspace="0.16666666666666666em" rspace="0em">sin</mo>
            <mrow>
                <mo>(</mo>
                <mrow>
                    <msqrt>
                        <mo>−</mo>
                        <mi>𝐶</mi>
                    </msqrt>
                    <mi>𝑥</mi>
                </mrow>
                <mo>)</mo>
            </mrow>
        </math></p>

    <h2>A Level 2 heading</h2>
    <h3>A Level 3 heading</h3>
    
    <div>
        <p>总能量</p>
        <math display="block">
            <mi>𝐸</mi>
            <mrow>
                <mo>(</mo>
                <mi>𝑡</mi>
                <mo>)</mo>
            </mrow>
            <mo>=</mo>
            <msubsup>
                <mo form="prefix" lspace="0em" rspace="0em">∫</mo>
                <mn>0</mn>
                <msub>
                    <mi>𝐿</mi>
                    <mn>0</mn>
                </msub>
            </msubsup>
            <mrow displaystyle="false">
                <mo>(</mo>
                <mrow>
                    <mfrac>
                        <msub>
                            <mi>𝜇</mi>
                            <mn>0</mn>
                        </msub>
                        <mn>2</mn>
                    </mfrac>
                    <msup>
                        <mrow>
                            <mo>(</mo>
                            <mfrac>
                                <mrow>
                                    <mi>𝜕</mi>
                                    <mi>𝑦</mi>
                                </mrow>
                                <mrow>
                                    <mi>𝜕</mi>
                                    <mi>𝑡</mi>
                                </mrow>
                            </mfrac>
                            <mo>)</mo>
                        </mrow>
                        <mn>2</mn>
                    </msup>
                    <mo>+</mo>
                    <mfrac>
                        <msub>
                            <mi>𝑇</mi>
                            <mn>0</mn>
                        </msub>
                        <mn>2</mn>
                    </mfrac>
                    <msup>
                        <mrow>
                            <mo>(</mo>
                            <mfrac>
                                <mrow>
                                    <mi>𝜕</mi>
                                    <mi>𝑦</mi>
                                </mrow>
                                <mrow>
                                    <mi>𝜕</mi>
                                    <mi>𝑥</mi>
                                </mrow>
                            </mfrac>
                            <mo>)</mo>
                        </mrow>
                        <mn>2</mn>
                    </msup>
                </mrow>
                <mo>)</mo>
            </mrow>
            <mi displaystyle="false">𝑑</mi>
            <mi displaystyle="false">𝑥</mi>
        </math>
    </div>

</body>

</html>
